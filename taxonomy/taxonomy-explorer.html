const facets=[["topics","Topics"],["entities","Entities"],["geo","Geo"],["formats","Formats"],["page_types","Page types"],["programs","Programs"],["onboarding","Onboarding map"],["decisions","Decisions"]];

$("#tabs").innerHTML=facets.map(f=>`<button data-f="${f[0]}">${f[1]}</button>`).join(" ");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const hay=n=>JSON.stringify([n.id,n.label,n.aliases,n.legacy]).toLowerCase();
function det(n){const p=[];if(n.aliases)p.push("aliases: "+n.aliases.join(", "));
 if(n.legacy)p.push("legacy: "+Object.entries(n.legacy).map(([k,v])=>k+"="+[].concat(v).join("|")).join("; "));

function node(n,kids){return `<div class="node"><div class="row"><span class="lab">${esc(n.label)}</span><span class="b ${n.conf||""}">${n.conf||"?"}</span>${n.type?`<span class="b t">${esc(n.type)}</span>`:""}<span class="id">${esc(n.id)}</span></div><div class="det">${det(n)}</div>${kids||""}</div>`}
function tree(list,q){const by={};list.forEach(n=>(by[n.parent||"_"]??=[]).push(n));
 const keep=new Set();if(q){list.forEach(n=>{if(hay(n).includes(q)){let x=n;while(x){keep.add(x.id);x=list.find(y=>y.id===x.parent)}}})}
 const r=p=>(by[p]||[]).filter(n=>!q||keep.has(n.id)).map(n=>node(n,by[n.id]?`<div class="kids">${r(n.id)}</div>`:"")).join("");return r("_")}
